    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Namzu" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Aplica o tema antes da primeira pintura para evitar flicker.
      // Fonte de verdade: localStorage["namzu-theme"] ∈ {"light","dark","system"}.
      // Default para novos usuários: "system" (segue prefers-color-scheme).
      (function () {
        try {
          var saved = localStorage.getItem('namzu-theme') || 'system';
          var isDark = saved === 'dark' || (saved === 'system' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) document.documentElement.classList.add('dark');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', isDark ? '#14213a' : '#ffffff');
        } catch (e) {}
      })();
    </script>
